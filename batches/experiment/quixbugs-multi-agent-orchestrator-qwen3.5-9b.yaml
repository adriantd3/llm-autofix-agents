name: experiment-quixbugs-multi-agent-orchestrator-qwen3.5-9b
description: TFM experiment — QuixBugs subset (20 bugs, stratified), multi_agent_orchestrator,
  qwen3.5-9b-ctx65k
dataset: ../../datasets/quixbugs.yaml
global:
  architecture: multi_agent_orchestrator
  llm:
    provider: ollama
    model: qwen3.5-9b-ctx65k
    max_turns: 30
    extra_body:
      think: false
  max_iterations: 3
  timeout_seconds: 800
  iteration_timeout_seconds: 500
  capture_errors: true
bugs:
- bitcount
- find_in_sorted
- gcd
- max_sublist_sum
- mergesort
- quicksort
- sieve
- to_base
- breadth_first_search
- depth_first_search
- detect_cycle
- hanoi
- is_valid_parenthesization
- rpn_eval
- knapsack
- levenshtein
- lcs_length
- minimum_spanning_tree
- shortest_path_length
- topological_ordering
