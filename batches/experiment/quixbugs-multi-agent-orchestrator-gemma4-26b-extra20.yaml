name: experiment-quixbugs-multi-agent-orchestrator-gemma4-26b-extra20
description: TFM experiment — QuixBugs remaining 20 bugs, multi_agent_orchestrator, gemma4-26b-ctx32k
dataset: ../../datasets/quixbugs.yaml
global:
  architecture: multi_agent_orchestrator
  llm:
    provider: ollama
    model: gemma4-26b-ctx32k
    max_turns: 30
  max_iterations: 3
  timeout_seconds: 800
  iteration_timeout_seconds: 500
  capture_errors: true
bugs:
- bucketsort
- find_first_in_sorted
- flatten
- get_factors
- kheapsort
- kth
- lis
- longest_common_subsequence
- next_palindrome
- next_permutation
- pascal
- possible_change
- powerset
- reverse_linked_list
- shortest_path_lengths
- shortest_paths
- shunting_yard
- sqrt
- subsequences
- wrap
