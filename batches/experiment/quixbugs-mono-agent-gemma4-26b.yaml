name: experiment-quixbugs-mono-agent-gemma4-26b
description: TFM experiment — QuixBugs subset (20 bugs, stratified), mono_agent, gemma4-26b-ctx32k
dataset: ../../datasets/quixbugs.yaml
global:
  architecture: mono_agent
  llm:
    provider: ollama
    model: gemma4-26b-ctx32k
    max_turns: 30
  max_iterations: 3
  timeout_seconds: 800
  iteration_timeout_seconds: 500
  capture_errors: true
bugs:
- bitcount
- find_in_sorted
- gcd
- max_sublist_sum
- mergesort
- quicksort
- sieve
- to_base
- breadth_first_search
- depth_first_search
- detect_cycle
- hanoi
- is_valid_parenthesization
- rpn_eval
- knapsack
- levenshtein
- lcs_length
- minimum_spanning_tree
- shortest_path_length
- topological_ordering
