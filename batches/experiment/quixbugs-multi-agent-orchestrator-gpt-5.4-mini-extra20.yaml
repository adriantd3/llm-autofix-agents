name: experiment-quixbugs-multi-agent-orchestrator-gpt-5.4-mini-extra20
description: TFM experiment — QuixBugs remaining 20 bugs, multi_agent_orchestrator, gpt-5.4-mini
dataset: ../../datasets/quixbugs.yaml
global:
  architecture: multi_agent_orchestrator
  llm:
    provider: openai
    model: gpt-5.4-mini
    max_turns: 15
  max_iterations: 3
  timeout_seconds: 800
  iteration_timeout_seconds: 500
  capture_errors: true
bugs:
- bucketsort
- find_first_in_sorted
- flatten
- get_factors
- kheapsort
- kth
- lis
- longest_common_subsequence
- next_palindrome
- next_permutation
- pascal
- possible_change
- powerset
- reverse_linked_list
- shortest_path_lengths
- shortest_paths
- shunting_yard
- sqrt
- subsequences
- wrap
