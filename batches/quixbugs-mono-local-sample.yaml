name: quixbugs-mono-local-sample
description: Mono-agent sample on 3 QuixBugs bugs with local Qwen 3.5

dataset: ../datasets/quixbugs.yaml

global:
  architecture: mono_agent
  llm:
    provider: ollama
    model: gemma4:26b
    max_turns: 20
  max_iterations: 3
  timeout_seconds: 300
  capture_errors: true

bugs:
  - gcd
  - flatten
  - mergesort