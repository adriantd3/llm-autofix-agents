name: quixbugs-handoff-local
description: Multi-agent handoff on QuixBugs with local Qwen 3.5

dataset: ../datasets/quixbugs.yaml

global:
  architecture: multi_agent_handoff
  llm:
    provider: ollama
    model: qwen3.5:9b
    max_turns: 20
  max_iterations: 3
  timeout_seconds: 300
  capture_errors: true

bugs:
  - all