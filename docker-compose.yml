services:
  runner:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      RUNNER_NAME: "${RUNNER_NAME:-runner}"
      RUN_REPOSITORY: "${RUN_REPOSITORY:-https://github.com/jkoppel/QuixBugs.git}"
      RUN_BRANCH: "${RUN_BRANCH:-master}"
      RUN_ARCHITECTURE: "${RUN_ARCHITECTURE:-mono-agent}"
      RUN_AGENT_MODELS: '${RUN_AGENT_MODELS:-{"main":"llama3.1:8b"}}'
      RUN_BOOTSTRAP_PROMPT: "${RUN_BOOTSTRAP_PROMPT:-Fix failing tests with minimal changes.}"
      RUN_TEST_COMMAND: "${RUN_TEST_COMMAND:-uv run --with pytest pytest python_testcases/test_gcd.py}"
    volumes:
      - ./results:/results
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
